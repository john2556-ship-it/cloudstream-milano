name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches: [master, main]
    paths-ignore: ['*.md']
  workflow_dispatch:

# allow the job to push the built plugin to the "builds" branch
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds (missing on first run)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: "builds"
          path: "builds"

      - name: Prepare builds branch
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/builds/.git" ]; then
            rm -rf "$GITHUB_WORKSPACE/builds" && mkdir -p "$GITHUB_WORKSPACE/builds"
            cd "$GITHUB_WORKSPACE/builds"
            git init -q
            git checkout -q -b builds
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          fi
          rm -f "$GITHUB_WORKSPACE"/builds/*.cs3

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Build plugins
        run: |
          cd "$GITHUB_WORKSPACE/src"
          chmod +x gradlew
          ./gradlew make makePluginsJson
          cp */build/*.cs3 "$GITHUB_WORKSPACE/builds"
          cp build/plugins.json "$GITHUB_WORKSPACE/builds"

      - name: Write repo.json
        run: |
          cat > "$GITHUB_WORKSPACE/builds/repo.json" <<EOF
          {
            "name": "Milano",
            "description": "Nguồn phim KKPhim cho CloudStream",
            "manifestVersion": 1,
            "pluginLists": ["https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/builds/plugins.json"]
          }
          EOF
          echo "Repo URL: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/builds/repo.json"

      - name: Push builds
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit -q --amend -m "Build $GITHUB_SHA" 2>/dev/null || git commit -q -m "Build $GITHUB_SHA" || exit 0
          git push --force origin HEAD:builds
